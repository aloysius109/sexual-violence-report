name: Publish sexual violence report
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the reviewed publication manifest and local links
        run: python check_publication.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish sexual violence report
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
