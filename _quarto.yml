project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - worldwide.qmd
    - uk.qmd
    - children.qmd
    - justice.qmd
    - methods.qmd
  resources:
    - "!docs/**"
    - "!medium/**"
    - data/**
    - assets/**
website:
  title: "Sexual violence in perspective"
  description: "Worldwide evidence and a detailed UK view, with adults and childhood experiences presented separately."
  site-url: "https://aloysius109.github.io/sexual-violence-report/"
  image: "https://aloysius109.github.io/assets/og/sexual-violence.png"
  open-graph:
    image-width: 1200
    image-height: 630
  twitter-card:
    card-style: summary_large_image
  navbar:
    background: "#dfe9e2"
    foreground: "#263e4c"
    left:
      - href: index.qmd
        text: Overview
      - href: worldwide.qmd
        text: Worldwide
      - href: uk.qmd
        text: UK detail
      - href: children.qmd
        text: Childhood
      - href: justice.qmd
        text: Justice
      - href: methods.qmd
        text: Methods & sources
  search: true
  page-footer:
    left: "[Kathryn Hopkins](https://aloysius109.github.io/) · Data vintages vary; checked 6 November 2026"
    right: "Sources: WHO, UNICEF, UNODC & ONS · Reuse terms vary; see Methods"
format:
  html:
    theme: cosmo
    css: assets/report.css
    include-in-header: head-social.html
    include-after-body: analytics.html
    canonical-url: true
    toc: true
    toc-depth: 2
    lang: en-GB
    link-external-newwindow: true
execute:
  enabled: false
